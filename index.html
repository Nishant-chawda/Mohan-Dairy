.modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:50}
.toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);background:rgba(20,16,10,.92);color:#fff;padding:14px 24px;border-radius:12px;font-weight:700;font-size:15px;z-index:200;opacity:0;pointer-events:none;transition:opacity .2s ease;text-align:center;max-width:80vw}
.toast.show{opacity:1}
.box{background:var(--card);border-radius:14px;padding:20px;width:100%;max-width:400px;max-height:90vh;overflow:auto}
label{display:block;font-size:14px;color:var(--mute);margin:10px 0 3px}
input,textarea{width:100%;font:inherit;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tabs button{background:transparent;color:var(--secondary);border:1px solid var(--secondary)}.tabs button.on{background:var(--secondary);color:#fff}
.ord{background:var(--card);border:1px solid var(--line);border-left:5px solid var(--gold);border-radius:10px;padding:12px;margin-bottom:10px}
.ord.done{border-left-color:var(--ok);opacity:.7}
.ed{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px;display:grid;gap:4px}
.tag{font-size:12px;background:var(--gold);color:#fff;border-radius:6px;padding:2px 6px}
.cart-badge{position:absolute;top:-8px;right:-12px;background:var(--primary);color:#fff;font-size:11px;font-weight:bold;border-radius:50%;width:17px;height:17px;display:flex;align-items:center;justify-content:center}

<script>
// ---------- DEFAULTS (shown until the owner edits anything) ----------
const E={shrikhand:'🍨',ghee:'🧈',curd:'🥛'};
const DEF={
 cfg:{name:'Mohan Dairy',tagline:'Pure, fresh, and made with love',heroCaption:'',phone:'',whatsapp:'',email:'',facebook:'',instagram:'',address:'Nagpur, Maharashtra',hours:'Daily, 7:00 AM – 9:00 PM',about:'Mohan Dairy brings you traditional shrikhand, ghee, and curd made from fresh milk.',adminUser:'admin',adminPass:'mohan123'},
 products:{
  p1:{name:'Elaichi Shrikhand',price:'₹120',unit:'250 g',desc:'Classic, creamy shrikhand flavoured with cardamom.',e:E.shrikhand,o:1},

 features:{
  f1:{e:'🥛',t:'Pure & Fresh',d:'Made fresh daily using quality milk, with nothing artificial added.',o:1},
  f2:{e:'🏺',t:'Traditional Recipes',d:'Classic shrikhand and ghee made the way it has always been made.',o:2},
  f3:{e:'🚪',t:'Doorstep Delivery',d:'Order online and get it delivered straight to your home.',o:3},
  f4:{e:'❤️',t:'Trusted by Families',d:'Loved by customers for its taste and quality, order after order.',o:4}
 }
};
let cfg={...DEF.cfg},P={},R={},O=[],H={},F={},GAL={},CART={},db=null,canEdit=false,assets=null,tab='orders',firstLoad=true,heroIdx=0,revIdx=0,loginErr='';
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const prods=()=>{const ids=new Set([...Object.keys(DEF.products),...Object.keys(P)]);
 return [...ids].map(id=>({id,inStock:true,...DEF.products[id],...P[id]})).filter(p=>!p.deleted).sort((a,b)=>(a.o||99)-(b.o||99))};
const revs=()=>{const m={...DEF.reviews,...R};return Object.entries(m).filter(([,r])=>!r.deleted).map(([id,r])=>({id,...r}))};
const heroList=()=>Object.entries(H).filter(([,h])=>!h.deleted).map(([id,h])=>({id,...h})).sort((a,b)=>(a.at||0)-(b.at||0));
const galleryList=()=>Object.entries(GAL).filter(([,h])=>!h.deleted).map(([id,h])=>({id,...h})).sort((a,b)=>(a.at||0)-(b.at||0));
const featList=()=>{const ids=new Set([...Object.keys(DEF.features),...Object.keys(F)]);
 return [...ids].map(id=>({id,...DEF.features[id],...F[id]})).filter(f=>!f.deleted).sort((a,b)=>(a.o||99)-(b.o||99))};
const isAdmin=()=>location.hash==='#admin';
const cartLines=()=>Object.entries(CART).map(([key,c])=>({key,...c}));
const cartCount=()=>cartLines().reduce((n,c)=>n+c.qty,0);
function sizeGrams(size){
 if(!size)return null;
 const s=String(size).trim().toLowerCase();
 const m=s.match(/([\d.]+)\s*(kgs?|kilograms?|g|grams?|ml|l|litres?|liters?)?/);
 if(!m)return null;
 let n=parseFloat(m[1]);if(isNaN(n)||n<=0)return null;
 const unit=m[2]||'g';
 if(/^(kg|kilo)/.test(unit)||/^(l|lit)/.test(unit))n*=1000;
 return n;
}
function basePriceNum(p){return parseFloat(String(p.price).replace(/[^0-9.]/g,''))||0}
function baseUnitGrams(p){const n=parseFloat(String(p.unit))||250;return /kg/i.test(p.unit||'')?n*1000:n}
function linePrice(c){
 const g=sizeGrams(c.size);if(g==null)return null;
 const p=prods().find(x=>x.id===c.id);if(!p)return null;
 return Math.round(basePriceNum(p)/baseUnitGrams(p)*g);
}
const cartTotal=()=>cartLines().reduce((n,c)=>{const lp=linePrice(c);return n+(lp==null?0:lp)*c.qty},0);
const safeId=s=>String(s).replace(/[^a-zA-Z0-9]/g,'_');
function changeCartSize(oldKey,newSize){
 const item=CART[oldKey];if(!item)return;
 const newKey=item.id+'|'+newSize;
 if(newKey===oldKey)return;
 if(CART[newKey])CART[newKey].qty+=item.qty;else CART[newKey]={...item,size:newSize};
 delete CART[oldKey];
 render();
}
function addToCart(id){
 const p=prods().find(x=>x.id===id);if(!p||!p.inStock)return;
 const key=id+'|250 g';
 if(CART[key])CART[key].qty++;else CART[key]={id,name:p.name,price:p.price,size:'250 g',qty:1};
 render();
}

function heroImgs(){
 const h=heroList().map(x=>x.img).filter(Boolean);
 if(h.length)return h;
 const u=prods().filter(p=>p.img).map(p=>p.img);

}
function heroHTML(){

}

function reviewSlideHTML(rv){
 if(!rv.length)return '<p style="text-align:center">No reviews yet.</p>';
 const n=rv.length,i=revIdx%n;
 return `<div class="rcarousel"><div class="rtrack" style="width:${n*100}%;transform:translateX(-${i*(100/n)}%)">${rv.map(r=>`<div class="rslide" style="width:${100/n}%"><div class="rev"><div class="stars">${'★'.repeat(r.stars||5)}</div><p>“${esc(r.text)}”</p><b>— ${esc(r.name)}</b></div></div>`).join('')}</div>
 ${n>1?`<button class="cnav prev" data-revprev aria-label="Previous review">&#10094;</button><button class="cnav next" data-revnext aria-label="Next review">&#10095;</button><div class="cdots" style="position:static;margin-top:14px">${rv.map((_,m)=>`<span class="dot" style="background:${m===i?'var(--gold)':'var(--line)'}"></span>`).join('')}</div>`:''}</div>`;
}
function shop(){
 const rv=revs(),ps=prods().slice(0,4);
 return `${pageHeader()}
 ${heroHTML()}
 <main>
 <section><div class="wrap"><h2 class="t">Why Mohan Dairy</h2><div class="grid" style="gap:28px">${featList().map(f=>`<div class="feat"><div class="e">${esc(f.e)}</div><h3>${esc(f.t)}</h3><p>${esc(f.d)}</p></div>`).join('')}</div></div></section>
 <section><div class="wrap"><h2 class="t">Our Products</h2><div class="grid" style="gap:28px">${ps.map(p=>`
  <div class="card"><div class="im" style="${p.img?`background-image:url('${esc(p.img)}')`:''}">${p.img?'':p.e||'🥛'}${p.inStock?'':'<div class="oos">Out of stock</div>'}</div>
  <div class="b"><h3>${esc(p.name)}</h3><div>${esc(p.desc)}</div>
  <button data-addcart="${p.id}" ${p.inStock?'':'disabled'}>${p.inStock?'Add to Cart':'Out of stock'}</button></div></div>`).join('')}</div><div style="text-align:center;margin-top:28px"><a class="btn ghost" style="text-decoration:none;display:inline-block" href="#products">View All Products</a></div></div></section>
 <section style="background:var(--card);border-block:1px solid var(--line)"><div class="wrap" style="text-align:center"><h2 class="t">Our Story</h2><p>${esc(cfg.about)}</p><a class="btn ghost" style="text-decoration:none;display:inline-block;margin-top:14px" href="#about">Read More</a></div></section>
 <section class="revs"><div class="wrap"><h2 class="t">What Our Customers Say</h2>${reviewSlideHTML(rv)}</div></section>
 </main>
 ${siteFooter(false)}`;
}

}

function fileToImageBlob(file){
 return new Promise((resolve,reject)=>{
  const img=new Image(),url=URL.createObjectURL(file);
  img.onload=()=>{
   URL.revokeObjectURL(url);
   const max=1600;let w=img.naturalWidth,h=img.naturalHeight;
   if(!w||!h)return reject(new Error('That file could not be read as an image.'));
   if(w>max||h>max){if(w>h){h=Math.round(h*max/w);w=max}else{w=Math.round(w*max/h);h=max}}
   const c=document.createElement('canvas');c.width=w;c.height=h;
   c.getContext('2d').drawImage(img,0,0,w,h);
   c.toBlob(b=>b?resolve(b):reject(new Error('Could not process that image.')),'image/jpeg',0.85);
  };
  img.onerror=()=>{URL.revokeObjectURL(url);reject(new Error('That file could not be read as an image. Please choose a JPG or PNG photo.'))};
  img.src=url;
 });
}
async function uploadImage(file){const blob=await fileToImageBlob(file);return assets.upload(blob,{type:'image/jpeg'});}

const PAGE_TITLES={'#admin':'Owner Panel – Mohan Dairy','#products':'Our Products – Mohan Dairy','#about':'About Us – Mohan Dairy','#contact':'Contact Us – Mohan Dairy','#reviews':'Customer Reviews – Mohan Dairy','#gallery':'Gallery – Mohan Dairy','#cart':'Your Cart – Mohan Dairy','#account':'My Account – Mohan Dairy'};
function render(){
 const keep=document.activeElement&&document.activeElement.closest('.ed')&&document.activeElement.tagName==='INPUT';
 if(keep&&isAdmin()&&tab!=='orders')return; // don't wipe fields while typing
 const h=location.hash;
 try{
  const view=h==='#admin'?admin():h==='#products'?productsPage():h==='#about'?aboutPage():h==='#contact'?contactPage():h==='#reviews'?reviewsPage():h==='#gallery'?galleryPage():h==='#cart'?cartPage():h==='#account'?accountPage():shop();
  $('#app').innerHTML=view;
  document.title=PAGE_TITLES[h]||'Mohan Dairy — Fresh Shrikhand, Ghee & Curd';
 }catch(e){
  $('#app').innerHTML=`<div class="wrap" style="padding:60px 0;text-align:center"><h2>Something went wrong</h2><p>Please reload the page. If this keeps happening, let us know.</p><button onclick="location.reload()">Reload</button></div>`;
 }
}

function beep(){try{const a=new AudioContext(),o=a.createOscillator();o.connect(a.destination);o.frequency.value=880;o.start();o.stop(a.currentTime+.25)}catch(e){}}
render();
setInterval(()=>{if(!isAdmin()){const n=heroImgs().length;if(n>1){heroIdx=(heroIdx+1)%n;render()}}},4000);
setInterval(()=>{if(location.hash===''||location.hash==='#'){const n=revs().length;if(n>1){revIdx=(revIdx+1)%n;render()}}},3000);

// ---------- DATA ----------
(async()=>{
 try{
  if(!window.claude||!claude.use)return;
  const user=await claude.use('user');canEdit=!!(user&&user.canEdit());
  assets=await claude.use('assets');
  db=await claude.use('db');if(!db)return render();
  db.collection('products').onSnapshot(s=>{P={};s.docs.forEach(d=>P[d.id]=d.data());render()},()=>{});
  db.collection('reviews').onSnapshot(s=>{R={};s.docs.forEach(d=>R[d.id]=d.data());render()},()=>{});
  db.collection('hero').onSnapshot(s=>{H={};s.docs.forEach(d=>H[d.id]=d.data());render()},()=>{});
  db.collection('gallery').onSnapshot(s=>{GAL={};s.docs.forEach(d=>GAL[d.id]=d.data());render()},()=>{});
  db.collection('features').onSnapshot(s=>{F={};s.docs.forEach(d=>F[d.id]=d.data());render()},()=>{});
  db.doc('site/config').onSnapshot(s=>{if(s.exists)cfg={...DEF.cfg,...s.data()};render()},()=>{});
  if(canEdit)db.collection('orders').orderBy('at','desc').onSnapshot(s=>{
   const n=s.docs.length;O=s.docs.map(d=>({id:d.id,...d.data()}));
   if(!firstLoad&&n>0&&O.filter(o=>o.status==='new').length)beep();firstLoad=false;render()},()=>{});
  render();
 }catch(e){render()}
})();
