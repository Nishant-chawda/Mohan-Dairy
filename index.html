.box{background:var(--card);border-radius:14px;padding:20px;width:100%;max-width:400px;max-height:90vh;overflow:auto}

<script>
// ---------- SUPABASE AUTH ----------
const SUPABASE_URL='https://sxhxhmrmskhjkijilhds.supabase.co';
const SUPABASE_KEY='sb_publishable_Vcp1VSrAPEPlYOQTaX8b8A_JxaQfgGZ';
const sb=(window.supabase&&window.supabase.createClient)?window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY):null;
let pendingPhone='';
function toE164Phone(raw){
 const digits=String(raw||'').replace(/\D/g,'');
 if(String(raw||'').trim().startsWith('+')&&digits.length>=10)return '+'+digits;
 if(digits.length===10)return '+91'+digits;
 if(digits.length===11&&digits.startsWith('0'))return '+91'+digits.slice(1);
 if(digits.length>=11)return '+'+digits;
 return null;
}
async function sendPhoneOtp(rawMobile,isResend=false){
 const msgEl=$('#acm');
 if(!sb){if(msgEl)msgEl.textContent='Supabase client failed to initialize.';return}
 const phone=toE164Phone(rawMobile);
 if(!phone){if(msgEl)msgEl.textContent='Please enter a valid mobile number (e.g. 10 digits or +91...).';return}
 pendingPhone=phone;
 let saved={};try{saved=JSON.parse(localStorage.getItem('md_profile')||'{}')}catch(err){}
 try{localStorage.setItem('md_profile',JSON.stringify({...saved,mobile:rawMobile.trim(),phone}))}catch(err){}
 if(msgEl)msgEl.textContent=isResend?'Resending OTP...':'Sending OTP...';
 const {error}=await sb.auth.signInWithOtp({phone,options:{channel:'sms'}});
 if(error){if(msgEl)msgEl.textContent=error.message||'Could not send OTP.';return}
 otpSent=true;
 render();
 const updatedMsg=$('#acm');
 if(updatedMsg)updatedMsg.textContent=`OTP ${isResend?'resent':'sent'} via SMS to ${phone}.`;
 toast(isResend?'OTP resent':'OTP sent');
}

// ---------- DEFAULTS (shown until the owner edits anything) ----------
const E={shrikhand:'🍨',ghee:'🧈',curd:'🥛'};
const DEF={
 cfg:{name:'Mohan Dairy',tagline:'Pure, fresh, and made with love',heroCaption:'',phone:'',whatsapp:'',email:'',facebook:'',instagram:'',address:'Nagpur, Maharashtra',hours:'Daily, 7:00 AM – 9:00 PM',about:'Mohan Dairy brings you traditional shrikhand, ghee, and curd made from fresh milk.',adminUser:'admin',adminPass:'mohan123'},
 products:{
  p1:{name:'Elaichi Shrikhand',price:'₹120',unit:'250 g',desc:'Classic, creamy shrikhand flavoured with cardamom.',e:E.shrikhand,o:1},
  p2:{name:'Amrakhand',price:'₹140',unit:'250 g',desc:'Creamy shrikhand blended with sweet mango pulp.',e:E.shrikhand,o:2},
  p3:{name:'Butterscotch Shrikhand',price:'₹140',unit:'250 g',desc:'Smooth shrikhand with a rich butterscotch crunch.',e:E.shrikhand,o:3},
  p4:{name:'Pineapple Shrikhand',price:'₹130',unit:'250 g',desc:'Sweet and tangy pineapple flavour.',e:E.shrikhand,o:4},
  p5:{name:'Strawberry Shrikhand',price:'₹130',unit:'250 g',desc:'Fresh and fruity strawberry flavour.',e:E.shrikhand,o:5},
  p6:{name:'Buffalo Ghee',price:'₹650',unit:'500 ml',desc:'Pure, aromatic, golden ghee made from buffalo milk.',e:E.ghee,o:6},
  p7:{name:'Curd',price:'₹60',unit:'500 g',desc:'Thick, fresh curd, set daily.',e:E.curd,o:7}},
 reviews:{r1:{name:'Customer name',stars:5,text:'This is a sample review. Please replace it from the admin panel.'}},
 features:{
  f1:{e:'🥛',t:'Pure & Fresh',d:'Made fresh daily using quality milk, with nothing artificial added.',o:1},
  f2:{e:'🏺',t:'Traditional Recipes',d:'Classic shrikhand and ghee made the way it has always been made.',o:2},
  f3:{e:'🚪',t:'Doorstep Delivery',d:'Order online and get it delivered straight to your home.',o:3},
  f4:{e:'❤️',t:'Trusted by Families',d:'Loved by customers for its taste and quality, order after order.',o:4}
 }
};
let cfg={...DEF.cfg},P={},R={},O=[],H={},F={},GAL={},CART={},db=null,canEdit=false,assets=null,tab='orders',firstLoad=true,heroIdx=0,revIdx=0,loginErr='',otpSent=false;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const prods=()=>{const ids=new Set([...Object.keys(DEF.products),...Object.keys(P)]);
 return [...ids].map(id=>({id,inStock:true,...DEF.products[id],...P[id]})).filter(p=>!p.deleted).sort((a,b)=>(a.o||99)-(b.o||99))};
const revs=()=>{const m={...DEF.reviews,...R};return Object.entries(m).filter(([,r])=>!r.deleted).map(([id,r])=>({id,...r}))};
const heroList=()=>Object.entries(H).filter(([,h])=>!h.deleted).map(([id,h])=>({id,...h})).sort((a,b)=>(a.at||0)-(b.at||0));
const galleryList=()=>Object.entries(GAL).filter(([,h])=>!h.deleted).map(([id,h])=>({id,...h})).sort((a,b)=>(a.at||0)-(b.at||0));
const featList=()=>{const ids=new Set([...Object.keys(DEF.features),...Object.keys(F)]);
 return [...ids].map(id=>({id,...DEF.features[id],...F[id]})).filter(f=>!f.deleted).sort((a,b)=>(a.o||99)-(b.o||99))};
const isAdmin=()=>location.hash==='#admin';
const cartLines=()=>Object.entries(CART).map(([key,c])=>({key,...c}));
const cartCount=()=>cartLines().reduce((n,c)=>n+c.qty,0);
function sizeGrams(size){
 if(!size)return null;
 const s=String(size).trim().toLowerCase();
 const m=s.match(/([\d.]+)\s*(kgs?|kilograms?|g|grams?|ml|l|litres?|liters?)?/);
 if(!m)return null;
 let n=parseFloat(m[1]);if(isNaN(n)||n<=0)return null;
 const unit=m[2]||'kg';
 if(/^(kg|kilo)/.test(unit)||/^(l|lit)/.test(unit))n*=1000;
 return n;
}
function basePriceNum(p){return parseFloat(String(p.price).replace(/[^0-9.]/g,''))||0}
function baseUnitGrams(p){const n=parseFloat(String(p.unit))||250;return /kg/i.test(p.unit||'')?n*1000:n}
function linePrice(c){
 const g=sizeGrams(c.size);if(g==null)return null;
 const p=prods().find(x=>x.id===c.id);if(!p)return null;
 return Math.round(basePriceNum(p)/baseUnitGrams(p)*g);
}
const cartTotal=()=>cartLines().reduce((n,c)=>{const lp=linePrice(c);return n+(lp==null?0:lp)*c.qty},0);
const safeId=s=>String(s).replace(/[^a-zA-Z0-9]/g,'_');
function changeCartSize(oldKey,newSize){
 const item=CART[oldKey];if(!item)return;
 const newKey=item.id+'|'+newSize;
 if(newKey===oldKey)return;
 if(CART[newKey])CART[newKey].qty+=item.qty;else CART[newKey]={...item,size:newSize};
 delete CART[oldKey];
 render();
}
function addItemToCart(id,size,qty){
 const p=prods().find(x=>x.id===id);if(!p)return;
 const key=id+'|'+size;
 if(CART[key])CART[key].qty+=qty;else CART[key]={id,name:p.name,price:p.price,size,qty};
 render();
}
function addToCartModal(id){
 const p=prods().find(x=>x.id===id);if(!p||!p.inStock)return;
 const m=document.createElement('div');m.className='modal';
 m.innerHTML=`<div class="box"><h3>${esc(p.name)}</h3>
 <label>Size</label><select id="atcsz" style="width:100%;font:inherit;padding:9px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink)">
  <option value="250 g">250 g</option>
  <option value="500 g">500 g</option>
  <option value="1 kg">1 kg</option>
  <option value="Custom order">Custom order</option>
 </select>
 <input id="atccu" class="hide" placeholder="Type your custom quantity, e.g. 2 kg" style="margin-top:6px">
 <div class="row" style="margin-top:14px"><button id="atcadd">Add to Cart</button><button class="ghost" id="atccancel">Cancel</button></div>
 <p id="atcm" style="color:var(--mute)"></p></div>`;
 document.body.appendChild(m);
 $('#atccancel').onclick=()=>m.remove();
 $('#atcsz').onchange=()=>$('#atccu').classList.toggle('hide',$('#atcsz').value!=='Custom order');
 $('#atcadd').onclick=()=>{
  const sz=$('#atcsz').value==='Custom order'?$('#atccu').value.trim():$('#atcsz').value;
  if(!sz){$('#atcm').textContent='Please enter your custom quantity.';return}
  addItemToCart(id,sz,1);
  toast('Added to cart successfully');
  m.remove();
 };
